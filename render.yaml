services:
  # Backend API Service
  - type: web
    name: sales-backend
    env: java
    plan: free
    region: oregon
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/sales-management-backend-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sales-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sales-db
          property: password

  # Frontend Service
  - type: static
    name: sales-frontend
    plan: free
    region: oregon
    buildCommand: cd sales-frontend && npm install && npm run build
    publicPath: sales-frontend/dist
    routes:
      - path: /api/*
        destination: https://sales-backend.onrender.com/api

databases:
  - name: sales-db
    region: oregon
