services:
  # Backend API Service
  - type: web
    name: sales-backend
    region: oregon
    buildCommand: cd . && mvn clean package -DskipTests
    startCommand: java -jar target/sales-management-backend-1.0.0.jar
    healthCheckPath: /api/products
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sales-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sales-db
          property: password
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: -Xmx512m

  # Frontend Service
  - type: web
    name: sales-frontend
    region: oregon
    buildCommand: cd sales-frontend && npm install && VITE_API_BASE_URL=/api npm run build
    startCommand: npm install -g serve && serve -s dist -p 3000

databases:
  - name: sales-db
    databaseName: sales_db
    user: sales_user
    region: oregon
