services:
  # ========== BACKEND ==========
  - type: web
    name: sales-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sales-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sales-db
          property: password


  # ========== FRONTEND ==========
  - type: web
  name: sales-frontend
  runtime: node
  plan: free
  region: oregon
  rootDir: sales-frontend
  buildCommand: npm install && npm run build
  startCommand: npx serve -s dist -p 3000

# ========== DATABASE ==========
databases:
  - name: sales-db
    plan: free
    region: oregon