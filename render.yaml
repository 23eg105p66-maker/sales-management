services:
  # Backend API Service
  - type: web
    name: sales-backend
    env: java
    region: oregon
    buildCommand: cd . && mvn clean package -DskipTests
    startCommand: java -jar target/sales-management-backend-1.0.0.jar
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sales-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sales-db
          property: password
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: -Xmx512m

  # Frontend Service
  - type: web
    name: sales-frontend
    env: node
    region: oregon
    buildCommand: cd sales-frontend && npm install && npm run build
    startCommand: npm install -g serve && serve -s dist -l 3000
    routes:
      - path: /api/*
        destination: sales-backend:8080/api

databases:
  - name: sales-db
    databaseName: sales_db
    user: sales_user
    region: oregon
