services:
  # ========== BACKEND ==========
  - type: web
    name: sales-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/sales-management-backend-1.0.0.jar
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sales-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sales-db
          property: password

  # ========== FRONTEND ==========
  - type: web
    name: sales-frontend
    rootDir: sales-frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -p 3000
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        value: /api

# ========== DATABASE ==========
databases:
  - name: sales-db
    plan: free
    region: oregon