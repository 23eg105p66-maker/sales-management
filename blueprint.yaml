services:
  # ===== BACKEND =====
  - type: web
    name: sales-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: jdbcConnectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sales-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sales-db
          property: password

  # ===== FRONTEND =====
  - type: web
    name: sales-frontend
    env: node
    rootDir: sales-frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -p 10000
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sales-backend.onrender.com

databases:
  - name: sales-db
    plan: free
    region: oregon