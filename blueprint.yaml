services:
  - type: web
    name: sales-backend
    env: docker
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sales-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sales-db
          property: password

  - type: web
    name: sales-frontend
    env: node
    rootDir: sales-frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -p 3000
    plan: free
    region: oregon

databases:
  - name: sales-db
    plan: free
    region: oregon