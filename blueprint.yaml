services:
  - type: web
    name: sales-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar
    plan: free
    region: oregon

  - type: web
    name: sales-frontend
    rootDir: sales-frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -p 3000
    plan: free
    region: oregon

databases:
  - name: sales-db
    plan: free
    region: oregon